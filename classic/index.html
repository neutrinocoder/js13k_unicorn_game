    if (e.tongue > 0) {
        let warning = e.boss && e.tongue > .8, L = warning ? 900 : reach(e);
        context.save();
        context.globalAlpha = warning ? .25 : 1;
        for (let angle of rays(e)) {
            let col = e.boss ? beamColors[e.power || 0] : e.wind ? "#c8e5ee" : e.blue ? "#5ecaff" : e.red ? "#85192f" : "#000";
            let w = warning ? 2 : e.boss ? e.power === 3 ? 40 : 18 : 7;
            let x2 = e.x + Math.cos(angle) * L, y2 = e.y + (e.boss ? -25 : 10) + Math.sin(angle) * L;
            let line = (width, color) => {
                context.strokeStyle = color;
                context.lineWidth = width;
                context.beginPath();
                context.moveTo(e.x, e.y + (e.boss ? -25 : 18));
                context.lineTo(x2, y2);
                context.stroke();
            };
            if (e.boss && !warning) {
                context.save();
                context.globalAlpha *= .35;
                line(w + 16, e.power === 2 ? "#9461dd" : col);
                context.restore();
            }
            line(w, col);
            line(1.5, e.boss ? e.power === 2 ? "#65577c" : col : e.red ? "#ff697c" : "#fff");
        }
        context.restore();
    }
}

function cloud(x, y, s, col) {
    context.fillStyle = col;
    context.beginPath();
    context.ellipse(x, y, 55 * s, 20 * s, 0, 0, 7);
    context.ellipse(x - 38 * s, y + 4 * s, 30 * s, 17 * s, 0, 0, 7);
    context.ellipse(x + 38 * s, y + 5 * s, 34 * s, 16 * s, 0, 0, 7);
    context.fill();
}

function ridge(points, bottom, col) {
    context.fillStyle = col;
    context.beginPath();
    context.moveTo(0, bottom);
    for (let a of points) context.lineTo(a[0], a[1]);
    context.lineTo(VIEW_WIDTH, bottom);
    context.closePath();
    context.fill();
}

function scenery() {
    let sky = context.createLinearGradient(0, cameraY, 0, cameraY + VIEW_HEIGHT);
    sky.addColorStop(0, [ "#171a23", "#8d4568", "#423329", "#321821", "#779ab6" ][zone]);
    sky.addColorStop(1, [ "#454952", "#d99cac", "#88705a", "#873933", "#dfedf2" ][zone]);
    rect(0, cameraY, VIEW_WIDTH, VIEW_HEIGHT, sky);
    cloud(180 + Math.sin(elapsedTime * .1) * 45, cameraY + 130, 2, "#ffffff18");
    cloud(690, cameraY + 260, 3, "#ffffff13");
    if (zone === 3) {
        ridge([ [ 0, 5100 ], [ 180, 4900 ], [ 425, 4550 ], [ 490, 4550 ], [ 760, 5e3 ], [ 960, 4800 ] ], 5700, "#42232b");
        context.strokeStyle = "#ee8250";
        context.lineWidth = 5;
        context.beginPath();
        context.moveTo(455, 4550);
        context.lineTo(490, 4710);
        context.lineTo(440, 4830);
        context.stroke();
    }
    if (zone === 4) ridge([ [ 0, cameraY + VIEW_HEIGHT ], [ 220, cameraY + 250 ], [ 480, cameraY + VIEW_HEIGHT ], [ 730, cameraY + 210 ], [ 960, cameraY + VIEW_HEIGHT ] ], cameraY + VIEW_HEIGHT, "#b4cbd8");
}

function weather() {
    context.save();
    context.strokeStyle = [ "#ffffff18", "#ffe0ec88", "#b9c2d077", "#ffb578aa", "#ffffff88" ][zone];
    context.lineWidth = 1.5;
    for (let i = 0; i < 70; i++) {
        let x = (i * 173 + elapsedTime * (zone === 1 ? Math.sin(elapsedTime * .7) * 100 : 20) + 1e5) % VIEW_WIDTH, y = ((i * 137 + elapsedTime * (zone === 2 ? 300 : 25)) % VIEW_HEIGHT + VIEW_HEIGHT) % VIEW_HEIGHT;
        context.beginPath();
        context.moveTo(x, y);
        context.lineTo(x + (zone === 1 ? 35 : zone === 0 ? 70 : 3), y + (zone === 2 ? 18 : 2));
        context.stroke();
    }
    for (let h of hail) {
        if (h.warn > 0) {
            context.fillStyle = "#fff";
            context.fillText("!", h.x, 95);
        } else rect(h.x - 4, h.y - cameraY - 5, 8, 10, "#fff");
    }
    context.restore();
}

function drawPlatform(a, z, edge) {
    let x = a.x, y = a.y, w = a.w, shade = context.createLinearGradient(x, y, x, y + 30);
    shade.addColorStop(0, [ "#a7dce9", "#523039", "#4d623b", "#423956" ][z]);
    shade.addColorStop(1, [ "#467b99", "#21151e", "#1c3026", "#171525" ][z]);
    context.save();
    context.fillStyle = shade;
    context.beginPath();
    context.moveTo(x, y);
    context.lineTo(x + w, y);
    context.lineTo(x + w - 4, y + 18);
    for (let k = w - 12; k > 4; k -= 23) context.lineTo(x + k, y + 22 + Math.sin(k + a.i) * 5);
    context.lineTo(x + 3, y + 18);
    context.closePath();
    context.fill();
    context.fillStyle = edge;
    context.beginPath();
    context.moveTo(x, y);
    context.lineTo(x + w, y);
    context.lineTo(x + w - 3, y + 4);
    for (let k = w - 8; k > 0; k -= 18) context.lineTo(x + k, y + 4 + Math.sin(k + a.i) * 1.5);
    context.lineTo(x, y + 3);
    context.fill();
    for (let k = 15; k < w - 12; k += 37) {
        let xx = x + k, h = 7 + (Math.sin(k + a.i) + 1) * 5;
        if (z === 0) {
            context.fillStyle = "#b8e8f2";
            context.beginPath();
            context.moveTo(xx, y + 16);
            context.lineTo(xx + 4, y + 23 + h);
            context.lineTo(xx + 10, y + 17);
            context.fill();
            context.strokeStyle = "#ffffff70";
            context.beginPath();
            context.moveTo(xx - 5, y + 6);
            context.lineTo(xx + 6, y + 12);
            context.stroke();
        }
        if (z === 1) {
            context.strokeStyle = "#ff9555";
            context.shadowColor = "#ff642e";
            context.shadowBlur = 5;
            context.lineWidth = 1.5;
            context.beginPath();
            context.moveTo(xx, y + 6);
            context.lineTo(xx - 4, y + 11);
            context.lineTo(xx + 5, y + 15);
            context.lineTo(xx + 2, y + 21);
            context.stroke();
            context.shadowBlur = 0;
        }
        if (z === 2) {
            context.fillStyle = "#8e7153";
            context.beginPath();
            context.ellipse(xx, y + 5, 5, 2, 0, 0, 7);
            context.fill();
            let drip = (elapsedTime * .3 + k) % 1;
            context.globalAlpha = 1 - drip;
            context.beginPath();
            context.ellipse(xx + 3, y + 20 + drip * 18, 1.6, 3, 0, 0, 7);
            context.fill();
            context.globalAlpha = 1;
        }
    }
    context.restore();
}

function drawWorld() {
    context.save();
    context.translate(-cameraX, -cameraY);
    scenery();
    if (flipped) drawHazards();
    for (let i = 0; i < platforms.length; i++) {
        let a = platforms[i];
        if (a.y < cameraY - 60 || a.y > cameraY + VIEW_HEIGHT + 40) continue;
        let z = flipped ? a.y > 8500 ? 1 : a.y > 5700 ? 2 : a.y > 2900 ? 3 : 4 : 0, edge = [ "#7b8190", "#f4bfd8", "#a58b6e", "#ffc17a", "#e6faff" ][z];
        drawPlatform(a, [ 3, 3, 2, 1, 0 ][z], edge);
        if (a.move) {
            context.strokeStyle = "#bbc4d8";
            context.lineWidth = 1;
            context.beginPath();
            context.moveTo(a.ox - 32, a.y + 25);
            context.lineTo(a.ox + a.w + 32, a.y + 25);
            context.stroke();
        }
        if (flipped && [ 0, 31, 61, 92 ].includes(i)) {
            context.fillStyle = i === checkpointIndex ? "#83e9be" : "#fff";
            context.font = "24px monospace";
            context.textAlign = "center";
            context.fillText(i === checkpointIndex ? "◆" : "◇", a.x - 12, a.y + 4);
        }
    }
    for (const e of enemies) if (!e.dead) {
        blob(e);
        for (let i = 0; i < (e.boss ? 0 : e.max); i++) rect(e.x - e.max * 4 + i * 8, e.y - 18, 5, 3, i < e.hp ? "#fff" : "#555");
    }
    for (const q of particles) {
        context.globalAlpha = q.life;
        context.fillStyle = zone > 2 ? "#fff" : "#000";
        context.beginPath();
        context.arc(q.x, q.y, q.s, 0, 7);
        context.fill();
        context.globalAlpha = 1;
    }
    drawWeapons();
    unicorn();
    if (flipped && !enemies.some(e => e.boss)) {
        context.shadowColor = "#fff";
        context.shadowBlur = 24;
        rect(370, 70, 220, 124);
        context.shadowBlur = 0;
        rect(382, 82, 196, 100, "#fff");
        rect(390, 90, 180, 84);
        for (let i = 0; i < 7; i++) {
            let h = 22 + Math.sin(elapsedTime * 2 + i) * 12;
            rect(402 + i * 24, 102 + h, 12, 60 - h, "#fff");
        }
        context.fillStyle = "#fff";
        context.font = "900 14px monospace";
        context.textAlign = "center";
        context.fillText("THE WAY OUT", 480, 58);
    } else if (!flipped) {
        context.strokeStyle = "#b5a2ff";
        context.lineWidth = 8;
        context.beginPath();
        context.ellipse(480, 11448, 460, 24, 0, 0, 7);
        context.stroke();
    }
    context.restore();
}

function hud() {
    context.save();
    for (let i = 0; i < 5; i++) {
        rect(804, 124 + i * 23, 138, 21, [ "#41454f", "#bc7193", "#70553c", "#ad4932", "#8cbaca" ][i]);
        context.fillStyle = "#fff";
        context.font = "bold 12px monospace";
        context.textAlign = "center";
        context.fillText(discovered & 1 << i ? REGION_NAMES[i] : "?", 873, 139 + i * 23);
        if (i === zone) {
            context.strokeStyle = "#fff";
            context.lineWidth = 2;
            context.strokeRect(804, 124 + i * 23, 138, 21);
        }
    }
    if (layerTime > 0) {
        context.save();
        context.globalAlpha = Math.min(1, layerTime, 6 - layerTime);
        context.textAlign = "center";
        context.font = "italic bold 52px Georgia";
        context.strokeStyle = "#17202c";
        context.lineWidth = 6;
        context.strokeText(REGION_NAMES[layer], 480, 210);
        context.fillStyle = "#fff";
        context.fillText(REGION_NAMES[layer], 480, 210);
        context.font = 'italic 23px "Segoe Script", cursive';
        context.lineWidth = 4;
        let quote = [ "That without hope we live on in desire.", "The infernal hurricane that never rests", "Eternal, maledict, and cold, and heavy;", "For flames between the sepulchres were scattered,", "The semblance had of glass, and not of water." ][layer];
        context.strokeText(quote, 480, 260, 740);
        context.fillText(quote, 480, 260, 740);
        context.font = "13px Georgia";
        context.fillText("Dante", 480, 290);
        context.restore();
    }
    if (player.freeze) {
        rect(400, 80, 160, 30, "#153d65");
        context.fillStyle = "#b5f1ff";
        context.textAlign = "center";
        context.font = "14px monospace";
        context.fillText("FROZEN", 480, 100);
    }
    if (taunt > 0 && !flipped) {
        context.save();
        let age = 8 - taunt;
        context.globalAlpha = Math.min(1, taunt);
        if (warned !== 2) blob({ boss: 1, x: VIEW_WIDTH + 90 - 240 * Math.min(1, age / 1.2, taunt), y: 230, phase: 0 });
        context.textAlign = "center";
        context.font = "bold 26px Georgia";
        context.lineWidth = 5;
        context.strokeStyle = "#160e24";
        context.fillStyle = "#ecd4ff";
        if (warned === 2) {
            context.fillStyle = context.shadowColor = "#fff2bd";
            context.shadowBlur = 18;
        }
        let msgs = warned === 2 ? [
            [ "The path to paradise begins in hell.", 480, 100 ],
            [ "You have to fall down to reach heaven.", 480, 145 ],
            [ "From Zeus", 480, 190 ]
        ] : [
            [ "You will never escape!", 380, 150 ],
            [ "Ha ha ha!", 210, 290 ],
            [ "HA HA HA!", 520, 410 ]
        ];
        [ 1, 2.5, 4 ].forEach((delay, i) => {
            if (age > delay) {
                let [text, x, y] = msgs[i];
                context.globalAlpha = Math.min(1, age - delay, taunt);
                context.strokeText(text, x, y);
                context.fillText(text, x, y);
            }
        });
        context.restore();
    }
    let boss = enemies.find(e => e.boss && !e.dead);
    if (boss) {
        rect(320, 86, 320, 30, "#201829");
        rect(325, 110, 310 * boss.hp / boss.max, 4, "#e56985");
        context.fillStyle = "#fff";
        context.textAlign = "center";
        context.font = "14px Georgia";
        context.fillText(boss.hp < 30 ? "HADES · ENRAGED" : "HADES", 480, 103);
    }
    rect(14, 480, 735, 50, "#172939");
    context.font = "13px monospace";
    context.textAlign = "left";
    context.fillStyle = "#fff";
    context.fillText("1 TAIL · 4 BLAST", 22, 500);
    context.fillText("CLICK/Z: " + [ "TAIL", "", "", "BLAST" ][weapon], 22, 522);
    rect(18, 16, 360, 58, "rgba(255,255,255,.94)");
    context.strokeStyle = "#000";
    context.lineWidth = 3;
    context.strokeRect(18, 16, 360, 58);
    context.fillStyle = "#000";
    context.font = "700 13px monospace";
    context.textAlign = "left";
    context.fillText("UNICORN", 34, 39);
    for (let i = 0; i < player.hp; i++) {
        context.beginPath();
        context.arc(112 + i * 18, 34, 5, 0, 7);
        context.fill();
    }
    context.fillText("TAIL", 34, 61);
    rect(94, 51, 250, 9, "#ccc");
    rect(94, 51, 250 * (1 - Math.min(1, attack / .6)), 9);
    if (announcementTime > 0) {
        rect(390, 18, 180, 34, "#fff");
        context.strokeRect(390, 18, 180, 34);
        context.textAlign = "center";
        context.fillStyle = "#101820";
        context.fillText(announcement, 480, 40);
    }
    context.textAlign = "center";
    rect(770, 430, 172, 92, "#172939");
    rect(775, 511, 162 * player.charge / 10, 6, "#94eaff");
    context.fillStyle = "#d1f6ff";
    context.font = "bold 17px monospace";
    context.fillText("BUBBLE SHIELD", 856, 457);
    context.font = "13px monospace";
    context.fillText(player.charge >= 10 ? "B / CLICK: READY" : Math.ceil(10 - player.charge) + "s", 856, 482);
    context.textAlign = "right";
    context.font = "bold 14px monospace";
    context.fillStyle = "#fff";
    context.fillText(weapon === 3 ? "AMMO ∞" : "TAIL WHIP", 730, 500);
    context.font = "12px monospace";
    context.fillStyle = "#bfe4ed";
    context.fillText(weapon === 3 ? player.reload > 0 ? "WAIT " + player.reload.toFixed(1) + "s" : "READY" : attack > 0 ? "RECOVERING" : "READY", 730, 521);
    context.restore();
}

let inkTime = 0;

function advanceIntro() {
    if (scene === "title") {
        scene = "prologue";
        inkTime = 0;
        shake = flash = 0;
    } else if (inkTime < 12) inkTime = 12; else {
        reset();
        for (let k in heldKeys) heldKeys[k] = 0;
        for (let k in pressedKeys) pressedKeys[k] = 0;
    }
}

function prologue() {
    rect(0, 0, VIEW_WIDTH, VIEW_HEIGHT, "#000");
    context.textAlign = "left";
    context.fillStyle = "#f3f3f3";
    context.font = '29px Georgia, "Times New Roman", serif';
    context.fillText("The age of Olympus", 78, 85);
    let lines = [ "You are one of Zeus's divine soldiers.", "Hades has trapped you in the depths of Hell.", "Alone, you must find a way to escape.", "Nobody has ever accomplished this before." ];
    let left = Math.floor(inkTime * 20);
    for (let i = 0; i < lines.length; i++) {
        context.fillText(lines[i].slice(0, Math.max(0, left)), 78, 175 + i * 70);
        left -= lines[i].length + 8;
    }
    context.fillStyle = "#888";
    context.font = "14px Georgia";
    context.fillText(inkTime < 12 ? "Enter / click to reveal" : "Enter / click to begin", 78, 495);
}

function title() {
    context.save();
    let bg = context.createLinearGradient(0, 0, 0, VIEW_HEIGHT);
    bg.addColorStop(0, "#090e20");
    bg.addColorStop(1, "#28394b");
    rect(0, 0, VIEW_WIDTH, VIEW_HEIGHT, bg);
    for (let i = 0; i < 55; i++) rect(i * 173 % VIEW_WIDTH, i * 97 % VIEW_HEIGHT, 1, 2, "#9cafc866");
    context.textAlign = "center";
    let ink = context.createLinearGradient(230, 0, 730, 0);
    rainbow.forEach((canvas, i) => ink.addColorStop(i / 5, canvas));
    context.font = "italic bold 64px Georgia";
    context.fillStyle = "#050a16";
    context.fillText("UNICORN", 483, 137);
    context.fillStyle = "#eef5ff";
    context.fillText("UNICORN", 480, 133);
    context.font = "900 82px Impact, fantasy";
    context.fillStyle = ink;
    context.fillText("ASCENT", 480, 214);
    context.strokeStyle = ink;
    context.lineWidth = 2;
    context.beginPath();
    context.moveTo(315, 233);
    context.lineTo(645, 233);
    context.stroke();
    unicorn({
        x: 455,
        y: 265,
        face: 1,
        ground: 1
    }, 2.1);
    context.fillStyle = "#dce9f4";
    context.font = "13px monospace";
    context.fillText("A / D MOVE · W DOUBLE JUMP · C DASH", 480, 356);
    context.fillText("CLICK AIM / FIRE · 1/4 WEAPONS · B BUBBLES", 480, 382);
    rect(355, 414, 250, 46, "#dce9f4");
    context.fillStyle = "#101a2a";
    context.font = "bold 17px Georgia";
    context.fillText("BEGIN", 480, 443);
    context.restore();
}

function end() {
    context.save();
    let sky = context.createLinearGradient(0, 0, 0, VIEW_HEIGHT);
    sky.addColorStop(0, "#12142c");
    sky.addColorStop(1, "#64788c");
    rect(0, 0, VIEW_WIDTH, VIEW_HEIGHT, sky);
    cloud(170, 370, 3, "#ffffff18");
    cloud(790, 320, 3, "#ffffff18");
    context.textAlign = "center";
    context.fillStyle = "#ffe7ad";
    context.font = "italic 24px Georgia";
    context.fillText("Hades has fallen.", 480, 105);
    context.font = "bold 58px Georgia";
    context.fillText("YOU ESCAPED HELL", 480, 180);
    unicorn({
        x: 440,
        y: 240,
        face: 1
    }, 2.5);
    context.fillStyle = "#fff";
    context.font = "20px Georgia";
    context.fillText("The first soul to find the other way.", 480, 365);
    context.font = "14px monospace";
    context.fillText("PRESS ENTER TO TRY AGAIN", 480, 450);
    context.restore();
}

function fit() {
    let r = canvas.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * d);
    canvas.height = Math.round(r.height * d);
}

onresize = fit;

fit();

function drawPortal() {
    let f = clamp(portalTime / 3, 0, 1), ease = f * f * (3 - 2 * f);
    rect(0, 0, VIEW_WIDTH, VIEW_HEIGHT, "#291624");
    context.save();
    context.translate(VIEW_WIDTH / 2, VIEW_HEIGHT / 2);
    context.rotate(Math.PI * (1 - ease));
    let sky = context.createLinearGradient(0, -VIEW_HEIGHT, 0, VIEW_HEIGHT);
    sky.addColorStop(0, "#8eb7d0");
    sky.addColorStop(1, "#a13f29");
    rect(-VIEW_WIDTH, -VIEW_HEIGHT, VIEW_WIDTH * 2, VIEW_HEIGHT * 2, sky);
    for (let i = 0; i < 24; i++) {
        let x = i * 173 % 1400 - 700, y = ((i * 97 - portalTime * 330) % 1e3 + 1e3) % 1e3 - 500;
        rect(x, y, 3, 30, i % 2 ? "#ffd38b" : "#e2faff");
    }
    context.strokeStyle = "#baa6ff";
    context.lineWidth = 7;
    context.beginPath();
    context.ellipse(0, -180 - ease * 500, 160, 35, 0, 0, 7);
    context.stroke();
    unicorn({
        x: -15,
        y: -60 + ease * 130,
        face: 1,
        vx: 0,
        ground: 0
    }, 1.8);
    context.restore();
    context.fillStyle = "#fff";
    context.textAlign = "center";
    context.font = "bold 20px monospace";
    context.fillText("THE WINDS OF LUST", VIEW_WIDTH / 2, 65);
}

function draw() {
    context.setTransform(canvas.width / VIEW_WIDTH, 0, 0, canvas.height / VIEW_HEIGHT, 0, 0);
    rect(0, 0, VIEW_WIDTH, VIEW_HEIGHT, "#dfedf2");
    context.save();
    if (shake) context.translate(randomBetween(-shake, shake), randomBetween(-shake, shake)),
    shake *= .85;
    scene === "prologue" ? prologue() : scene === "portal" ? drawPortal() : scene === "title" ? title() : scene === "play" ? (drawWorld(),
    weather(), hud(), crosshair()) : end();
    context.restore();
    if (flash > 0) {
        context.strokeStyle = "#000";
        context.lineWidth = 22;
        context.globalAlpha = flash * 6;
        context.strokeRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);
        context.globalAlpha = 1;
    }
}

function loop(n) {
    let dt = Math.min(.033, (n - last) / 1e3 || 0);
    last = n;
    update(dt);
    soundtrack();
    draw();
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
